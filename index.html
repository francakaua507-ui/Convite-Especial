<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um convite especial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- ELEMENTOS FLUTUANTES NO FUNDO (Corações) --- */
        .heart-bg {
            position: absolute;
            font-size: 1.6rem;
            user-select: none;
            pointer-events: none;
            animation: flutuar 7s linear infinite;
            bottom: -50px;
            opacity: 0.7;
            z-index: 1;
        }

        /* --- FRASES FLUTUANTES DA TRADUÇÃO (Nas Laterais) --- */
        #container-frases {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .frase-flutuante {
            position: fixed;
            bottom: 10%;
            max-width: 240px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 14px;
            color: #fff;
            font-size: 0.9rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: subirEdesaparecer 8s ease-out forwards;
            z-index: 999;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        @keyframes subirEdesaparecer {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            10% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(-150px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-180px) scale(0.8);
            }
        }

        /* --- ESTILO DOS CORAÇÃOZINHOS QUE SOBEM AO ESTOURAR --- */
        .coracao-estouro {
            position: fixed;
            font-size: 1.2rem;
            animation: explodirCoracao 1s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes explodirCoracao {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dirX), var(--dirY)) scale(1.4);
            }
        }

        @keyframes flutuar {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .container {
            background: transparent;
            padding: 20px;
            max-width: 420px;
            width: 100%;
            z-index: 10;
        }

        h1 {
            color: #ffffff;
            font-size: 1.7rem;
            margin-bottom: 30px;
            font-weight: 800;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            line-height: 1.4;
        }

        .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 50px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
            transition: transform 0.1s ease, background 0.3s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        #btn-sim {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        #btn-nao {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            transition: left 0.2s ease, top 0.2s ease;
            z-index: 99;
        }

        /* --- POP-UP MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 25px 20px;
            border-radius: 25px;
            max-width: 380px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            animation: popIn 0.3s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content img {
            width: 100%;
            max-width: 220px;
            height: auto;
            border-radius: 18px;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            object-fit: cover;
        }

        .modal-content h2 {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 15px;
            line-height: 1.4;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .frase-declaracao {
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 600;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.15);
            padding: 12px;
            border-radius: 15px;
        }

        .botoes-duvida {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn-duvida-sim {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            padding: 10px 20px;
            font-size: 1rem;
            flex: 1;
        }

        .btn-confirmar {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            width: 100%;
        }

        .btn-prosseguir {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-mais {
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            color: #2c3e50;
            margin-top: 20px;
            width: 100%;
        }

        .caixa-mensagem {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 22px;
            color: #2c3e50;
            font-size: 0.95rem;
            line-height: 1.5;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            animation: popIn 0.4s ease;
            text-align: center;
        }

        .texto-curiosidade {
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #d63031;
            font-weight: 800;
        }

        .easter-egg-18 {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #2d3436;
            opacity: 0.9;
            border-top: 1px dashed rgba(0, 0, 0, 0.15);
            padding-top: 12px;
        }

        .icone-sucesso {
            font-size: 4rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
    </style>
</head>
<body>

    <!-- Corações Flutuantes -->
    <div class="heart-bg" style="left: 10%; animation-duration: 6s; animation-delay: 0s;">💖</div>
    <div class="heart-bg" style="left: 25%; animation-duration: 8s; animation-delay: 2s;">✨</div>
    <div class="heart-bg" style="left: 40%; animation-duration: 5s; animation-delay: 1s;">🌸</div>
    <div class="heart-bg" style="left: 60%; animation-duration: 7s; animation-delay: 3s;">💕</div>
    <div class="heart-bg" style="left: 75%; animation-duration: 9s; animation-delay: 0.5s;">💗</div>
    <div class="heart-bg" style="left: 90%; animation-duration: 6s; animation-delay: 2.5s;">✨</div>

    <!-- Container para as Frases Flutuantes da Tradução (Nas Laterais) -->
    <div id="container-frases"></div>

    <!-- Conteúdo Principal -->
    <div class="container">
        <h1>Emilly Cassia duvido você conseguir apertar o botão não! Mas se não estiver conseguindo, pode ir de sim! 😉</h1>

        <div class="botoes">
            <button id="btn-sim" onclick="clicarSimPrincipal()">Sim!</button>
            <button id="btn-nao" onmouseover="fuger(this)" onclick="fuger(this)">Não</button>
        </div>
    </div>

    <!-- Pop-up Modal -->
    <div id="meuModal" class="modal-overlay">
        <div id="modalCorpo" class="modal-content"></div>
    </div>

    <!-- Elemento de Áudio Oculto -->
    <audio id="background-music" preload="auto" loop>
        <source src="https://files.catbox.moe/zm3nl0.mp3" type="audio/mpeg">
    </audio>
      
    <script>
        const fotos = ["foto1.png", "foto2.png", "foto3.png", "foto4.png"];
        let indiceFoto = 0;
        let intervaloSlides;

        // Lista com o tempo em segundos e a tradução sincronizada da música "Mercy"
        const legendasSincronizadas = [
            { tempo: 13.52, texto: "🎵 Você me tem em suas mãos..." },
            { tempo: 16.74, texto: "Nem sabe o tamanho do seu poder..." },
            { tempo: 20.24, texto: "Fico a metros de altura..." },
            { tempo: 23.11, texto: "Mas desmorono quando estou perto de você" },
            { tempo: 26.75, texto: "Me mostra uma porta aberta" },
            { tempo: 29.78, texto: "E depois vai lá e bate ela na minha cara" },
            { tempo: 33.33, texto: "Eu já não aguento mais" },
            { tempo: 36.26, texto: "Eu estou dizendo..." },
            { tempo: 37.45, texto: "Amor, por favor, tenha piedade de mim" },
            { tempo: 41.59, texto: "Pegue leve com meu coração" },
            { tempo: 44.32, texto: "Mesmo que você não queira me machucar" },
            { tempo: 48.06, texto: "Você continua me despedaçando" },
            { tempo: 50.87, texto: "Poderia por favor ter piedade, piedade do meu coração?" },
            { tempo: 57.45, texto: "Poderia por favor ter piedade, piedade do meu coração?" },
            { tempo: 65.56, texto: "Eu dirigiria a noite toda" },
            { tempo: 68.80, texto: "Só para ficar perto de você, amor" },
            { tempo: 72.17, texto: "Com o coração aberto, dou meu testemunho" },
            { tempo: 75.24, texto: "Me diga que eu não estou louco" },
            { tempo: 78.40, texto: "Eu não estou pedindo muito" },
            { tempo: 81.77, texto: "Apenas que você seja sincera comigo" },
            { tempo: 84.85, texto: "Meu orgulho é tudo o que eu tenho" },
            { tempo: 88.02, texto: "Eu estou dizendo..." },
            { tempo: 89.20, texto: "Amor, por favor, tenha piedade de mim" },
            { tempo: 93.35, texto: "Pegue leve com meu coração" },
            { tempo: 96.21, texto: "Mesmo que você não queira me machucar" },
            { tempo: 99.67, texto: "Você continua me despedaçando" },
            { tempo: 102.61, texto: "Poderia por favor ter piedade de mim?" },
            { tempo: 106.16, texto: "Eu sou um fantoche nas suas mãos" },
            { tempo: 109.08, texto: "E mesmo que você tenha boas intenções" },
            { tempo: 112.89, texto: "Eu preciso que você me libertes" },
            { tempo: 115.77, texto: "Poderia por favor ter piedade, piedade do meu coração?" },
            { tempo: 122.10, texto: "Poderia por favor ter piedade, piedade do meu coração?" },
            { tempo: 129.53, texto: "Consumindo todo o ar dentro dos meus pulmões..." },
            { tempo: 133.01, texto: "Rasgando toda a pele dos meus ossos..." },
            { tempo: 136.31, texto: "Estou preparado para sacrificar minha vida" },
            { tempo: 139.18, texto: "Eu faria isso de bom grado duas vezes" },
            { tempo: 142.60, texto: "Consumindo todo o ar dentro dos meus pulmões..." },
            { tempo: 146.05, texto: "Rasgando toda a pele dos meus ossos..." },
            { tempo: 149.35, texto: "Estou preparado para sacrificar minha vida" },
            { tempo: 152.05, texto: "Eu faria isso de bom grado duas vezes" },
            { tempo: 155.75, texto: "Oh, por favor, tenha piedade de mim" },
            { tempo: 159.78, texto: "Pegue leve com meu coração" },
            { tempo: 162.82, texto: "Mesmo que você não queira me machucar" },
            { tempo: 166.02, texto: "Você continua me despedaçando" },
            { tempo: 169.23, texto: "Poderia por favor ter piedade de mim?" },
            { tempo: 172.88, texto: "Eu sou um fantoche nas suas mãos" },
            { tempo: 175.43, texto: "E mesmo que você tenha boas intenções" },
            { tempo: 179.30, texto: "Eu preciso que você me libertes" },
            { tempo: 182.32, texto: "Estou te suplicando por piedade..." },
            { tempo: 189.27, texto: "Suplicando, por favor, amor (no meu coração)..." }
        ];

        // Função do botão "Não" fugir
        function fuger(btn) {
            btn.style.position = 'fixed';
            const margem = 30;
            const larguraMax = window.innerWidth - btn.offsetWidth - margem;
            const alturaMax = window.innerHeight - btn.offsetHeight - margem;

            const novaX = Math.max(margem, Math.floor(Math.random() * larguraMax));
            const novaY = Math.max(margem, Math.floor(Math.random() * alturaMax));

            btn.style.left = novaX + 'px';
            btn.style.top = novaY + 'px';
        }

        // Sistema para soltar frases flutuantes sincronizadas nas laterais com a música
        function iniciarFrasesSincronizadas() {
            const music = document.getElementById('background-music');
            if (!music) return;

            music.addEventListener('timeupdate', () => {
                const tempoAtual = music.currentTime;

                let legendaAtual = legendasSincronizadas.reduce((prev, curr) => {
                    return (tempoAtual >= curr.tempo) ? curr : prev;
                }, legendasSincronizadas[0]);

                if (legendaAtual && window.ultimaFraseExibida !== legendaAtual.texto) {
                    window.ultimaFraseExibida = legendaAtual.texto;
                    criarFraseNaTela(legendaAtual.texto);
                }
            });
        }

        // Função auxiliar que cria a caixinha flutuante com margem segura nas laterais
        function criarFraseNaTela(texto) {
            const container = document.getElementById('container-frases');
            if (!container) return;

            const p = document.createElement('div');
            p.className = 'frase-flutuante';
            p.innerText = texto;
            
            // Garante que nasce longe das bordas extremas (evita cortes)
            const ladoEsquerdo = Math.random() < 0.5;
            const posicaoX = ladoEsquerdo ? Math.floor(Math.random() * 20) + 5 : Math.floor(Math.random() * 20) + 60;
            p.style.left = posicaoX + '%';
            
            container.appendChild(p);

            // Dispara o estouro de corações um pouco antes do balão sumir (aos 7.5 segundos)
            setTimeout(() => {
                lancarCoracoesEstouro(p);
            }, 7500);

            // Remove o elemento após a animação terminar
            setTimeout(() => {
                p.remove();
            }, 8000);
        }

        // Função que gera mini-corações ao estourar o balão
        function lancarCoracoesEstouro(elementoBalao) {
            const rect = elementoBalao.getBoundingClientRect();
            const centroX = rect.left + rect.width / 2;
            const centroY = rect.top;

            for (let i = 0; i < 5; i++) {
                const coracao = document.createElement('div');
                coracao.className = 'coracao-estouro';
                coracao.innerHTML = '💖';
                
                coracao.style.left = centroX + 'px';
                coracao.style.top = centroY + 'px';

                const dirX = (Math.random() - 0.5) * 100 + 'px';
                const dirY = (Math.random() - 1) * 80 - 20 + 'px';
                coracao.style.setProperty('--dirX', dirX);
                coracao.style.setProperty('--dirY', dirY);

                document.body.appendChild(coracao);

                setTimeout(() => {
                    coracao.remove();
                }, 1000);
            }
        }

        // Função para disparar o áudio ao clicar em "Sim!"
        async function tocarMusicaAudio() {
            const music = document.getElementById('background-music');
            if (!music) return;

            try {
                music.currentTime = 0;
                let playPromise = music.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        iniciarFrasesSincronizadas();
                    }).catch(error => {
                        music.muted = false;
                        music.play();
                        iniciarFrasesSincronizadas();
                    });
                }
            } catch (error) {
                console.log("Erro geral no áudio:", error);
            }
        }

        // Ação principal ao clicar em "Sim!"
        function clicarSimPrincipal() {
            tocarMusicaAudio();
            abrirModalDuvida();
        }

        // Passo 1: Abre a etapa de dúvida
        function abrirModalDuvida() {
            const modal = document.getElementById('meuModal');
            const modalCorpo = document.getElementById('modalCorpo');
            
            modal.style.display = 'flex';
            clearInterval(intervaloSlides);

            modalCorpo.innerHTML = `
                <img src="https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif" alt="Dúvida pensativa">
                <h2>Você vai aceitar mesmo?</h2>
                <div class="botoes-duvida">
                    <button class="btn-duvida-sim" onclick="abrirSlideshowFotos()">Com certeza!</button>
                </div>
            `;
        }

        // Passo 2: Abre o carrossel de fotos com a declaração
        function abrirSlideshowFotos() {
            const modalCorpo = document.getElementById('modalCorpo');
            
            modalCorpo.innerHTML = `
                <img id="foto-slide" src="foto1.png" alt="Emilly Cássia">
                <p class="frase-declaracao">Eu já via sua beleza antes mesmo de ter os óculos, você é diferente como se fosse de outro mundo, e eu não só vejo a sua beleza mas também quem você é, seu jeito de falar, seu jeito de pensar, sua mensagem me faz feliz, escutar sua voz também me faz feliz!</p>
                <button class="btn-prosseguir" onclick="proximaEtapa()">Prosseguir ❤️</button>
            `;
            
            indiceFoto = 0;
            const imgElement = document.getElementById('foto-slide');
            
            clearInterval(intervaloSlides);
            intervaloSlides = setInterval(() => {
                indiceFoto = (indiceFoto + 1) % fotos.length;
                if(imgElement) imgElement.src = fotos[indiceFoto];
            }, 3000);
        }

        // Passo 3: Pergunta do final de semana
        function proximaEtapa() {
            clearInterval(intervaloSlides);
            const modalCorpo = document.getElementById('modalCorpo');
            modalCorpo.innerHTML = `
                <img src="https://media.giphy.com/media/qUIm5wu6LAAog/giphy.gif" alt="Gato de Botas fofo">
                <h2>Você vai estar livre no final de semana?</h2>
                <button class="btn-confirmar" onclick="finalizar()">Sim!</button>
            `;
        }

        // Passo 4: Mensagem final de sucesso
        function finalizar() {
            const modalCorpo = document.getElementById('modalCorpo');
            modalCorpo.innerHTML = `
                <div class="icone-sucesso">🥳💖</div>
                <h2>Ebaaa! 🎉<br><br>Depois você me diz qual horário fica melhor para você! 😊</h2>
                
                <button id="btnMais" class="btn-mais" onclick="revelarSegredo()">Mais? 👀</button>
                <div id="secaoSegredo"></div>
            `;
        }

        // Passo 5: Easter egg e segredo final
        function revelarSegredo() {
            document.getElementById('btnMais').style.display = 'none';

            const secao = document.getElementById('secaoSegredo');
            secao.innerHTML = `
                <div class="caixa-mensagem">
                    <p class="texto-curiosidade">
                        Eimy curiosa, a curiosidade matou o gato, né? Mas no seu caso é uma gatinha! 😼
                    </p>
                    
                    ☀️🌙 <b>Um detalhe especial:</b><br>
                    Lembra quando a gente só conversava pelo chat do jogo no Mobile Legends e eu disse que a gente parecia o sol e a lua? Então... acho que finalmente chegou a hora de acontecer o nosso eclipse! 🙈✨
                    <br><br>
                    Eii, não importa o quão difícil esteja sendo para você, Eimy: pra qualquer coisa, pode contar comigo sempre, tá? ❤️
                    
                    <div class="easter-egg-18">
                        🎁 <i>E como amanhã é meu aniversário de 18 anos, ter você aceitando esse convite já valeu como o melhor presente! 😂🎂</i>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
