<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Eimy ✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* Efeito Glassmorphism */
        .glass-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 380px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 10;
        }

        /* Tela de Entrada / Capa */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #fff;
        }

        p {
            font-size: 15px;
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-start {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-start:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }

        /* Conteúdo Principal */
        #main-content {
            display: none;
            text-align: center;
        }

        .gif-container img {
            width: 120px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Tela Inicial (Capa para liberar o áudio) -->
    <div id="welcome-screen">
        <div class="glass-box">
            <h2>Tem uma surpresa à tua espera... ✨</h2>
            <p>
                Duvido você conseguir apertar o botão "Não"...<br>
                Mas se não conseguir, pode ir de "Sim"! 😉
            </p>
            <button class="btn-start" onclick="iniciarExperiencia()">Abrir Surpresa 🎵</button>
        </div>
    </div>

    <!-- Conteúdo do Site / Convite com suas mensagens e GIF -->
    <div id="main-content" class="glass-box">
        <div class="gif-container">
            <!-- Podes colocar o link direto do teu GIF aqui no src -->
            <img src="URL_DO_TEU_GIF_AQUI.gif" alt="Fofo">
        </div>
        <h2>Eimy ✨</h2>
        <p>Aqui estão as tuas mensagens e o convite especial que preparaste com tanto carinho para ela.</p>
    </div>

    <!-- Elemento de Áudio (Shawn Mendes - Mercy) -->
    <audio id="background-music" loop>
        <source src="URL_DA_MUSICA_AQUI.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <script>
        function iniciarExperiencia() {
            // Esconde a tela inicial suavemente
            const welcomeScreen = document.getElementById('welcome-screen');
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.classList.add('hidden');
            }, 500);

            // Mostra o conteúdo principal do convite
            document.getElementById('main-content').style.display = 'block';

            // Dispara a música após o clique do usuário
            const music = document.getElementById('background-music');
            music.play().catch(error => {
                console.log("Erro ao reproduzir áudio:", error);
            });
        }
    </script>
</body>
</html>
