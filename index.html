<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Eclipse 🌙✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #333;
        }

        /* Container principal estilo card translúcido padronizado */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }

        .card img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1, p {
            font-size: 1.1rem;
            color: #444;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-yes {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #fff;
        }

        .btn-no {
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            color: #fff;
        }

        /* Balões flutuantes de fundo opcionais */
        .floating-balloon {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            max-width: 180px;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Exemplo da primeira tela já com o card padronizado -->
    <div class="card" id="step-1">
        <p>Emilly Cassia duvido você conseguir apertar o botão não! Mas se não estiver conseguindo, pode ir de sim! 😉</p>
        <div class="buttons-container">
            <button class="btn btn-yes" onclick="nextStep(2)">Sim! 💕</button>
            <button class="btn btn-no" id="btn-no" onmouseover="moveButton()">Não</button>
        </div>
    </div>

    <script>
        function nextStep(step) {
            // Lógica para avançar os passos do seu site
            console.log("Indo para o passo: " + step);
        }

        function moveButton() {
            const btnNo = document.getElementById('btn-no');
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight);
            btnNo.style.position = 'absolute';
            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;
        }
    </script>
</body>
</html>
