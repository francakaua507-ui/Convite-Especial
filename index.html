<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Eimy ✨</title>
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 320px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Tela Inicial -->
    <div id="welcome" class="box">
        <h2>Tem uma surpresa ✨</h2>
        <p>Clica no botão abaixo para ver!</p>
        <button onclick="entrar()">Abrir Surpresa</button>
    </div>

    <!-- Conteúdo do Convite -->
    <div id="content" class="box hidden">
        <h2>Eimy ✨</h2>
        <p>Aqui vai entrar o teu texto especial e o convite!</p>
    </div>

    <script>
        function entrar() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('content').classList.remove('hidden');
        }
    </script>

</body>
</html>
