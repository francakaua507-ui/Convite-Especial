<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um convite especial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- CORAÇÕES NO FUNDO --- */
        .heart-bg {
            position: absolute;
            font-size: 1.6rem;
            user-select: none;
            pointer-events: none;
            animation: flutuar 7s linear infinite;
            bottom: -50px;
            opacity: 0.7;
        }

        @keyframes flutuar {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        .heart-bg:nth-child(1) { left: 10%; animation-duration: 6s; animation-delay: 0s; }
        .heart-bg:nth-child(2) { left: 25%; animation-duration: 8s; animation-delay: 2s; }
        .heart-bg:nth-child(3) { left: 40%; animation-duration: 5s; animation-delay: 1s; }
        .heart-bg:nth-child(4) { left: 60%; animation-duration: 7s; animation-delay: 3s; }
        .heart-bg:nth-child(5) { left: 75%; animation-duration: 9s; animation-delay: 0.5s; }
        .heart-bg:nth-child(6) { left: 90%; animation-duration: 6s; animation-delay: 2.5s; }

        /* --- CONTEÚDO PRINCIPAL --- */
        .container {
            background: transparent;
            padding: 20px;
            max-width: 420px;
            width: 100%;
            z-index: 10;
        }

        h1 {
            color: #ffffff;
            font-size: 1.7rem;
            margin-bottom: 30px;
            font-weight: 800;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            line-height: 1.4;
        }

        .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 50px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
            transition: transform 0.1s ease, background 0.3s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        #btn-sim {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        #btn-nao {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            transition: left 0.2s ease, top 0.2s ease;
            z-index: 99;
        }

        .btn-musica-inicio {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 10px 24px;
            font-size: 0.95rem;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* --- POP-UP MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 25px 20px;
            border-radius: 25px;
            max-width: 380px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            animation: popIn 0.3s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content img {
            width: 100%;
            max-width: 220px;
            height: auto;
            border-radius: 18px;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            object-fit: cover;
        }

        .modal-content h2 {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 15px;
            line-height: 1.4;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .frase-oculos {
            font-size: 1rem;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            font-style: italic;
        }

        .btn-confirmar {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            width: 100%;
        }

        .btn-prosseguir {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-mais {
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            color: #2c3e50;
            margin-top: 20px;
            width: 100%;
        }

        .caixa-mensagem {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 22px;
            color: #2c3e50;
            font-size: 0.95rem;
            line-height: 1.5;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            animation: popIn 0.4s ease;
            text-align: center;
        }

        .texto-curiosidade {
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #d63031;
            font-weight: 800;
        }

        .easter-egg-18 {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #2d3436;
            opacity: 0.9;
            border-top: 1px dashed rgba(0, 0, 0, 0.15);
            padding-top: 12px;
        }

        .icone-sucesso {
            font-size: 4rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
    </style>
</head>
<body>

    <!-- Corações Flutuantes -->
    <div class="heart-bg">💖</div>
    <div class="heart-bg">✨</div>
    <div class="heart-bg">🌸</div>
    <div class="heart-bg">💕</div>
    <div class="heart-bg">💗</div>
    <div class="heart-bg">✨</div>

    <!-- Conteúdo Principal -->
    <div class="container">
        <h1>Emilly Cassia duvido você conseguir apertar o botão não! Mas se não estiver conseguindo, pode ir de sim! 😉</h1>

        <div class="botoes">
            <button id="btn-sim" onclick="abrirModal()">Sim!</button>
            <button id="btn-nao" onmouseover="fuger(this)" onclick="fuger(this)">Não</button>
        </div>

        <!-- Botão de Música no Início -->
        <div>
            <button class="btn-musica-inicio" onclick="tocarMusica()">🎵 Tocar música de fundo</button>
        </div>
    </div>

    <!-- Pop-up Modal -->
    <div id="meuModal" class="modal-overlay">
        <div id="modalCorpo" class="modal-content">
            <!-- Slideshow das Fotos -->
            <img id="foto-slide" src="foto1.jpg" alt="Emilly Cássia">
            <p class="frase-oculos">"Eu já via sua beleza antes mesmo de ter o óculos!"</p>
            <button class="btn-prosseguir" onclick="proximaEtapa()">Prosseguir ❤️</button>
        </div>
    </div>

    <!-- Elemento de Áudio -->
    <audio id="background-music" preload="auto" loop>
        <source src="mercy.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>
        
    <script>
        // Array com os nomes das fotos locais
        const fotos = ["foto1.png", "foto2.png", "foto3.png", "foto4.png"];
        let indiceFoto = 0;
        let intervaloSlides;

        function fuger(btn) {
            btn.style.position = 'fixed';
            
            const margem = 30;
            const larguraMax = window.innerWidth - btn.offsetWidth - margem;
            const alturaMax = window.innerHeight - btn.offsetHeight - margem;

            const novaX = Math.max(margem, Math.floor(Math.random() * larguraMax));
            const novaY = Math.max(margem, Math.floor(Math.random() * alturaMax));

            btn.style.left = novaX + 'px';
            btn.style.top = novaY + 'px';
        }

        function abrirModal() {
            document.getElementById('meuModal').style.display = 'flex';
            
            // Inicia a troca automática das fotos a cada 3 segundos
            indiceFoto = 0;
            document.getElementById('foto-slide').src = fotos[indiceFoto];
            
            clearInterval(intervaloSlides);
            intervaloSlides = setInterval(() => {
                indiceFoto = (indiceFoto + 1) % fotos.length;
                document.getElementById('foto-slide').src = fotos[indiceFoto];
            }, 3000);
        }

        function tocarMusica() {
            const music = document.getElementById('background-music');
            music.load();
            
            setTimeout(() => {
                music.play().then(() => {
                    event.target.innerText = "🎶 A tocar...";
                }).catch(error => {
                    console.log("Erro ao reproduzir áudio:", error);
                    alert("Clica novamente no botão para iniciar a música!");
                });
            }, 300);
        }

        // Nova etapa ao clicar no botão "Prosseguir"
        function proximaEtapa() {
            clearInterval(intervaloSlides); // Para o slideshow
            const modalCorpo = document.getElementById('modalCorpo');
            modalCorpo.innerHTML = `
                <img src="https://media.giphy.com/media/qUIm5wu6LAAog/giphy.gif" alt="Gato de Botas fofo">
                <h2>Vai estar livre no fim de semana? 😊</h2>
                <button class="btn-confirmar" onclick="finalizar()">Sim! ❤️</button>
            `;
        }

        function finalizar() {
            const modalCorpo = document.getElementById('modalCorpo');
            modalCorpo.innerHTML = `
                <div class="icone-sucesso">🥳💖</div>
                <h2>Ebaaa! 🎉<br><br>Depois você me diz qual horário fica melhor para você! 😊</h2>
                
                <button id="btnMais" class="btn-mais" onclick="revelarSegredo()">Mais? 👀</button>
                <div id="secaoSegredo"></div>
            `;
        }

        function revelarSegredo() {
            document.getElementById('btnMais').style.display = 'none';

            const secao = document.getElementById('secaoSegredo');
            secao.innerHTML = `
                <div class="caixa-mensagem">
                    <p class="texto-curiosidade">
                        Eimy curiosa, você sabia que a curiosidade matou o gato, né? Mas no seu caso é uma gatinha! 😼
                    </p>
                    
                    ☀️🌙 <b>Um detalhe especial:</b><br>
                    Lembra quando a gente só conversava pelo chat do jogo no Mobile Legends e eu disse que a gente parecia o sol e a lua? Então... acho que finalmente chegou a hora de acontecer o nosso eclipse! 🙈✨
                    <br><br>
                    Eii, não importa o quão difícil esteja sendo para você, Eimy: pra qualquer coisa, pode contar comigo sempre, tá? ❤️
                    
                    <div class="easter-egg-18">
                        🎁 <i>E como é meu aniversário de 18 anos, ter você aceitando esse convite já valeu como o melhor presente! 😂🎂</i>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>s
